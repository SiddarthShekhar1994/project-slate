[project]
name = "slate-api"
version = "0.1.0"
description = "Slate backend: verification, problem generation, grading, lessons, ingestion"
requires-python = ">=3.11"
dependencies = [
    "slate-skills",
    "sympy>=1.13",
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "anthropic>=1.0",
    "pymupdf>=1.25,<2",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "boto3>=1.35",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
]

[tool.uv.sources]
slate-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slate_api"]
