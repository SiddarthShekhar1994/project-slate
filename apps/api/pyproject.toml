[project]
name = "slate-api"
version = "0.1.0"
description = "Slate backend: verification, problem generation, grading, lessons, ingestion"
requires-python = ">=3.11"
dependencies = [
    "slate-skills",
    "sympy>=1.13",
]

[tool.uv.sources]
slate-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slate_api"]
