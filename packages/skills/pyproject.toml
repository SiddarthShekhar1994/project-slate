[project]
name = "slate-skills"
version = "0.1.0"
description = "Skill definitions for Slate: templates, difficulty bands, mistake patterns, formula sheet entries"
requires-python = ">=3.11"
dependencies = ["sympy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slate_skills"]
