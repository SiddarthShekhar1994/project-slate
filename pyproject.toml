[project]
name = "slate-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/skills"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]
# Packages the backend for the Windows app (apps/desktop).
desktop = ["pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["packages/skills/tests", "apps/api/tests"]
addopts = "-q"
