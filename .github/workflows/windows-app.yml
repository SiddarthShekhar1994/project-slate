# Builds the Slate Windows installer, installs it on a clean Windows machine
# and drives the installed app end to end. The installer is attached to every
# run (Actions tab -> the run -> Artifacts) and, for version tags like v0.1.0,
# to a GitHub Release.
#
# The Python tests run on Windows in a job of their own, so a problem there
# can't hold up or hide the installer.
name: Windows app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build, install and test the app
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # only used to attach the installer to a release on tags
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Python packages
        run: uv sync --all-packages --group desktop --frozen

      - name: Build the interface and the backend
        timeout-minutes: 30
        run: node apps/desktop/scripts/build.mjs

      - name: Smoke-test the packaged backend (timings, worker processes, its log)
        timeout-minutes: 10
        run: uv run python apps/desktop/scripts/smoke_backend.py apps/desktop/build/backend/slate-api.exe

      - name: Package the installer
        run: |
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop exec electron-builder --win --x64 --publish never

      - name: Install it silently, as a student would
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist/Slate-Setup-*.exe | Select-Object -First 1
          Write-Host "Installing $($installer.Name) ($([math]::Round($installer.Length / 1MB)) MB)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Slate\Slate.exe")) { throw "Slate.exe was not installed" }

      - name: Test the installed app
        timeout-minutes: 15
        run: |
          export SLATE_APP_PATH="$(cygpath -m "$LOCALAPPDATA")/Programs/Slate/Slate.exe"
          export TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP"  # so a failed run's app logs can be collected below
          pnpm --dir apps/desktop test

      - name: Show the app's logs from a failed test
        if: failure()
        run: |
          for f in "$(cygpath -u "$RUNNER_TEMP")"/slate-desktop-test-*/logs/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            tail -n 200 "$f"
          done

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Slate-Windows-installer
          path: apps/desktop/dist/Slate-Setup-*.exe
          if-no-files-found: error

      - name: Keep logs from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            apps/desktop/test-results
            ${{ runner.temp }}/slate-desktop-test-*/logs
          if-no-files-found: ignore

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Slate $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" apps/desktop/dist/Slate-Setup-*.exe --clobber

  python-tests:
    name: Python tests on Windows (SQLite)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Python packages
        run: uv sync --all-packages --frozen

      # Small parts, each in its own step, so the step list on the run page
      # shows which part is stuck even while the job is still going. See
      # run_pytest.py for why pytest doesn't run directly.
      - name: Collect every test
        timeout-minutes: 5
        run: .venv/Scripts/python.exe .github/scripts/run_pytest.py 180 --collect-only -q

      - name: Skills package
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: .venv/Scripts/python.exe .github/scripts/run_pytest.py 420 packages/skills/tests

      - name: API sandbox, storage and voice settings
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: .venv/Scripts/python.exe .github/scripts/run_pytest.py 420 apps/api/tests/test_platform.py

      - name: API source ingestion and OCR
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: .venv/Scripts/python.exe .github/scripts/run_pytest.py 420 apps/api/tests/ingest

      - name: API lessons, lesson scripts and speech
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: .venv/Scripts/python.exe .github/scripts/run_pytest.py 420 apps/api/tests/lessons apps/api/tests/lesson_gen

      - name: API photo answers and voice questions
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: .venv/Scripts/python.exe .github/scripts/run_pytest.py 420 apps/api/tests/test_stt_photo.py

      - name: API grading, generators and answer checks
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: >-
          .venv/Scripts/python.exe .github/scripts/run_pytest.py 840 apps/api/tests/skills apps/api/tests/verify
          apps/api/tests/test_grading.py apps/api/tests/test_problem_gen.py apps/api/tests/test_review_and_exam_rules.py

      - name: API against SQLite (the app's database)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          tmp="$(cygpath -m "$RUNNER_TEMP")"
          export TEST_DATABASE_URL="sqlite:///$tmp/slate_test.db"
          export STORAGE_DIR="$tmp/slate-test-storage"
          .venv/Scripts/python.exe .github/scripts/run_pytest.py 420 apps/api/tests/api
